name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Package.swift requires Swift tools 6.2; the macOS 15 image ships 6.1.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Swift test suite
        run: scripts/test.sh
